<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kulüp Araba Yarışı - Ana Ekran</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background: #222; color: white; font-family: sans-serif; }
        #gameArea { display: flex; margin-top: 20px; position: relative; }
        canvas { background: #333; border: 4px solid #111; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #qr-container { padding: 20px; background: white; border-radius: 10px; margin-left: 20px; text-align: center; color: black; display: flex; flex-direction: column; justify-content: center;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <h1>Büyük Yarışa Katılmak İçin QR Kodu Okutun!</h1>
    <div id="gameArea">
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        <div id="qr-container">
            <h3 id="room-code">Oda Yükleniyor...</h3>
            <div id="qrcode"></div>
            <p>Maksimum 2 Oyuncu</p>
        </div>
    </div>

    <script>
        const socket = io({
            transports: ['websocket'],
            extraHeaders: { "Bypass-Tunnel-Reminder": "true" }
        });
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let currentRoomId = ''; // Odayı hafızada tutuyoruz

        socket.emit('create_room');
        socket.on('room_created', (roomId) => {
            currentRoomId = roomId; // Yeni odayı kaydet
            document.getElementById('room-code').innerText = `Oda Kodu: ${roomId}`;
            const joinUrl = `${window.location.protocol}//${window.location.host}/controller.html?room=${roomId}`;
            
            // Eski QR'ı temizle ve yenisini çiz
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 128, height: 128 });
        });

        const players = [
            { id: 0, active: false, x: 450, y: 100, angle: 1.57, speed: 0, color: 'red', inputs: {}, lap: 0, cp1: false, cp2: false },
            { id: 1, active: false, x: 450, y: 180, angle: 1.57, speed: 0, color: 'blue', inputs: {}, lap: 0, cp1: false, cp2: false }
        ];

        let gameState = 'playing'; 
        let winnerText = '';
        const MAX_LAPS = 3; 

        socket.on('player_joined', (playerIndex) => {
            players[playerIndex].active = true;
        });

        socket.on('player_input', (data) => {
            players[data.playerIndex].inputs[data.input] = data.value;
        });

        const barriers = [
            { x: 0, y: 0, w: 1000, h: 40 },
            { x: 0, y: 660, w: 1000, h: 40 },
            { x: 0, y: 0, w: 40, h: 700 },
            { x: 960, y: 0, w: 40, h: 700 },
            { x: 40, y: 40, w: 100, h: 100 },
            { x: 860, y: 40, w: 100, h: 100 },
            { x: 40, y: 560, w: 100, h: 100 },
            { x: 860, y: 560, w: 100, h: 100 },
            { x: 280, y: 260, w: 440, h: 180 }
        ];

        function isColliding(x, y) {
            const carSize = 14;
            for(let b of barriers) {
                let testX = Math.max(b.x, Math.min(x, b.x + b.w));
                let testY = Math.max(b.y, Math.min(y, b.y + b.h));
                let dist = Math.hypot(x - testX, y - testY);
                if (dist < carSize) return true;
            }
            return false;
        }

        function drawTrack() {
            ctx.fillStyle = '#444';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            barriers.forEach(b => {
                ctx.fillStyle = '#d32f2f'; 
                ctx.fillRect(b.x, b.y, b.w, b.h);
                ctx.fillStyle = '#4caf50';
                ctx.fillRect(b.x + 6, b.y + 6, b.w - 12, b.h - 12);
            });

            for (let i = 40; i < 260; i += 20) {
                ctx.fillStyle = (i / 20) % 2 === 0 ? 'white' : 'black';
                ctx.fillRect(500, i, 10, 20);
                ctx.fillStyle = (i / 20) % 2 === 0 ? 'black' : 'white';
                ctx.fillRect(510, i, 10, 20);
            }
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Arial';
            ctx.fillText("START", 525, 158);
        }

        // Oyunu Sıfırlama Fonksiyonu (YENİLENDİ)
        function resetGame() {
            players[0] = { id: 0, active: false, x: 450, y: 100, angle: 1.57, speed: 0, color: 'red', inputs: {}, lap: 0, cp1: false, cp2: false };
            players[1] = { id: 1, active: false, x: 450, y: 180, angle: 1.57, speed: 0, color: 'blue', inputs: {}, lap: 0, cp1: false, cp2: false };
            gameState = 'playing';
            
            // Sunucuya "Oyun bitti, eski oyuncuları at ve bana yeni kod ver" diyoruz.
            socket.emit('game_over', currentRoomId);
        }

        const ACCELERATION = 0.2;
        const FRICTION = 0.92;
        const MAX_SPEED = 5.5;
        const TURN_SPEED = 0.015; 

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawTrack();

            players.forEach(p => {
                if (!p.active) return;

                if (gameState === 'playing') {
                    if (p.inputs.gas) p.speed += ACCELERATION;
                    if (p.inputs.brake) p.speed -= ACCELERATION;
                    
                    p.speed = Math.max(-MAX_SPEED / 2, Math.min(p.speed, MAX_SPEED));
                    p.speed *= FRICTION; 

                    if (Math.abs(p.speed) > 0.1) {
                        const direction = p.speed > 0 ? 1 : -1;
                        if (p.inputs.left) p.angle -= TURN_SPEED * direction;
                        if (p.inputs.right) p.angle += TURN_SPEED * direction;
                    }

                    if (p.x > 750) p.cp1 = true; 
                    if (p.x < 250) p.cp2 = true; 

                    if (p.x > 490 && p.x < 510 && p.y > 40 && p.y < 260 && p.cp1 && p.cp2) {
                        p.lap++;
                        p.cp1 = false; 
                        p.cp2 = false;

                        if (p.lap >= MAX_LAPS) {
                            gameState = 'finished';
                            winnerText = p.color === 'red' ? 'KIRMIZI KAZANDI!' : 'MAVİ KAZANDI!';
                            setTimeout(resetGame, 5000); 
                        }
                    }

                    let nextX = p.x + Math.sin(p.angle) * p.speed;
                    let nextY = p.y - Math.cos(p.angle) * p.speed;

                    if (isColliding(nextX, nextY)) {
                        p.speed = -p.speed * 0.5;
                    } else {
                        p.x = nextX;
                        p.y = nextY;
                    }
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                
                ctx.fillStyle = p.color;
                ctx.fillRect(-12, -22, 24, 44); 
                ctx.fillStyle = '#000';
                ctx.fillRect(-10, -10, 20, 10);
                ctx.fillStyle = 'yellow';
                ctx.fillRect(-10, -22, 6, 4);
                ctx.fillRect(4, -22, 6, 4);
                ctx.restore();
            });

            ctx.fillStyle = 'white';
            ctx.font = 'bold 26px Arial';
            ctx.textAlign = 'left';
            ctx.fillText(`KIRMIZI: ${players[0].lap} / ${MAX_LAPS}`, 50, 80);
            ctx.textAlign = 'right';
            ctx.fillText(`MAVİ: ${players[1].lap} / ${MAX_LAPS}`, 950, 80);

            if (gameState === 'finished') {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = winnerText.includes('KIRMIZI') ? '#ff4444' : '#4444ff';
                ctx.font = 'bold 64px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2);
                
                ctx.fillStyle = 'white';
                ctx.font = '24px Arial';
                ctx.fillText("Yeni yarış 5 saniye içinde başlıyor...", canvas.width / 2, canvas.height / 2 + 60);
                
                ctx.textAlign = 'left'; 
            }

            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
